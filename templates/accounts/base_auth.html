{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SkillMatch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/skillmatch.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="mb-4">
      <div class="auth-logo">Skill<span>Match</span></div>
      <div class="text-muted mt-1" style="font-size:13px">India's smartest internship platform</div>
    </div>
    {% if messages %}
      {% for message in messages %}
        <div class="flash-bar flash-{{ message.tags }}" style="margin-bottom:16px">
          <i class="bi bi-info-circle me-2"></i>{{ message }}
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
