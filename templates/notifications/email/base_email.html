<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f6f9; font-family: Arial, sans-serif; color: #1f2937; }
    .wrapper { width: 100%; padding: 24px 0; }
    .container { max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
    .header { background: #0d6efd; color: #ffffff; padding: 24px 32px; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { padding: 32px; line-height: 1.6; }
    .footer { padding: 20px 32px 32px; color: #6b7280; font-size: 13px; }
    .card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin: 16px 0; }
    .button { display: inline-block; padding: 12px 18px; border-radius: 8px; color: #ffffff !important; background: #0d6efd; text-decoration: none; margin-right: 10px; }
    .button.alt { background: #6c757d; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>SkillMatch</h1>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        This message was sent by SkillMatch. Please do not reply to this automated email.
      </div>
    </div>
  </div>
</body>
</html>
